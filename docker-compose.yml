services:
  # ==========================
  # Database
  # ==========================
  db:
    image: postgres:17-alpine
    container_name: freequeues_db
    env_file:
      - .env
    expose:
      - "5432"
    restart: unless-stopped
    volumes:
      - freequeues_db_data:/var/lib/postgresql/data
    networks:
      - freequeues_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "freequeues"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================
  # Redis
  # ==========================
  redis:
    image: redis:alpine
    container_name: freequeues_redis
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - freequeues_redis_data:/data
    networks:
      - freequeues_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
  # ==========================
  # Backend
  # ==========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: freequeues_backend
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - freequeues_static_volumes:/app/static
      - freequeues_media_volumes:/app/media
    command: ["/app/entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      smsbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - freequeues_network

  # ==========================
  # Celery Worker
  # ==========================
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: freequeues_celery_worker
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery -A config worker' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - freequeues_network

  # ==========================
  # Celery Beat
  # ==========================
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: freequeues_celery_beat
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - freequeues_celerybeat_schedule:/app/celerybeat-schedule
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler --pidfile=/tmp/celerybeat.pid
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery -A config beat' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - freequeues_network

  # ----------------------------------------
  # Kannel Bearerbox (SMS Gateway Core)
  # ----------------------------------------
  bearerbox:
    build:
      context: ./backend/kannel
      dockerfile: Dockerfile
    hostname: bearerbox
    container_name: freequeues_kannel_bearerbox
    env_file:
      - .env
    expose:
      - "13000"
      - "13001"
    volumes:
      - ./backend/kannel/kannel.conf:/etc/kannel/kannel.conf:ro
    command: /usr/sbin/bearerbox /etc/kannel/kannel.conf
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:13000/status.txt?password=$$KANNEL_PASSWORD",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - freequeues_network

  # ----------------------------------------
  # Kannel Smsbox (SMS Gateway Interface)
  # ----------------------------------------
  smsbox:
    build:
      context: ./backend/kannel
      dockerfile: Dockerfile
    container_name: freequeues_kannel_smsbox
    env_file:
      - .env
    hostname: smsbox
    expose:
      - "13013"
    volumes:
      - ./backend/kannel/kannel.conf:/etc/kannel/kannel.conf:ro
    command: /usr/sbin/smsbox /etc/kannel/kannel.conf
    depends_on:
      bearerbox:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://bearerbox:13000/status.txt?password=$$KANNEL_PASSWORD",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - freequeues_network
  # ==========================
  # Nginx
  # ==========================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: freequeues_nginx
    restart: unless-stopped
    volumes:
      - freequeues_static_volumes:/app/static
      - freequeues_media_volumes:/app/media
    ports:
      - "${APP_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
      celery_worker:
        condition: service_healthy
      celery_beat:
        condition: service_healthy
    networks:
      - freequeues_network

  # ----------------------------------------
  # Prometheus
  # ----------------------------------------
  prometheus:
    image: prom/prometheus
    container_name: freequeues_prometheus
    volumes:
      - ./backend/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090"
    networks:
      - freequeues_network
    depends_on:
      backend:
        condition: service_started
  # ----------------------------------------
  # Grafana
  # ----------------------------------------
  grafana:
    image: grafana/grafana
    container_name: freequeues_grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./backend/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - freequeues_network

    depends_on:
      prometheus:
        condition: service_started
# ==========================
# Volumes
# ==========================
volumes:
  freequeues_db_data:
  freequeues_redis_data:
  freequeues_media_volumes:
  freequeues_static_volumes:
  freequeues_celerybeat_schedule:
  grafana_data:

# ==========================
# Networks
# ==========================
networks:
  freequeues_network:
    driver: bridge
